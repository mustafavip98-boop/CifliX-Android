name: CifliX Native Android Build

on:
  push:
    branches: [ciflix-player-native]
    paths:
      - 'native-player/**'
      - '.github/workflows/ciflix-native-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CifliX-Player-debug
          path: native-player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
